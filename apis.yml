aid: metycle
name: METYCLE
description: 'METYCLE is a Cologne, Germany-based digital B2B marketplace and AI-powered
  trading platform for the international secondary (scrap) metal industry, connecting
  suppliers and buyers of recycled metals - copper, aluminum, zinc, nickel, lead and
  magnesium - across borders. Operated by METYCLE GmbH and led by managing directors
  Rafael Suchan and Sebastian Brenner, the company raised a 14.1M euro Series A round
  to expand its platform for transparent, sustainable global metal trade and to advance
  circular-economy sourcing of secondary metals. Its customer platform supports biddable
  listings, product discovery and trade execution. This profile was added to the API
  Evangelist network as a company/provider record; METYCLE currently exposes no public
  developer API.'
